<div class="lm-diagram lm-diag lm-diag--pipeline">
  <style>
    .lm-diag--pipeline {
      --lm-p-surface: var(--md-default-bg-color, #ffffff);
      --lm-p-card: var(--md-code-bg-color, #f8fafc);
      --lm-p-border: rgba(148, 163, 184, 0.35);
      --lm-p-text: var(--md-default-fg-color, #0f172a);
      --lm-p-muted: var(--md-default-fg-color--light, #475569);
      --lm-p-blue: #2563eb;
      --lm-p-amber: #d97706;
      --lm-p-emerald: #059669;
      --lm-p-violet: #7c3aed;
      --lm-p-rose: #e11d48;
      background: var(--lm-p-surface);
      border: 1px solid var(--lm-p-border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin: 1.5rem 0;
    }
    [data-md-color-scheme="slate"] .lm-diag--pipeline {
      --lm-p-surface: #121521;
      --lm-p-card: #171b2a;
      --lm-p-border: rgba(148, 163, 184, 0.24);
      --lm-p-blue: #60a5fa;
      --lm-p-amber: #fbbf24;
      --lm-p-emerald: #34d399;
      --lm-p-violet: #a78bfa;
      --lm-p-rose: #fb7185;
    }
    .lm-diag--pipeline input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    #lm-pipe-http:checked ~ .lm-diag-tabs label[for="lm-pipe-http"],
    #lm-pipe-stdio:checked ~ .lm-diag-tabs label[for="lm-pipe-stdio"] {
      border-color: var(--lm-p-blue);
      background: rgba(37, 99, 235, 0.14);
      color: var(--lm-p-blue);
    }
    .lm-diag--pipeline .lm-pipe-panel {
      display: none;
    }
    #lm-pipe-http:checked ~ .lm-pipe-panels .lm-panel-http,
    #lm-pipe-stdio:checked ~ .lm-pipe-panels .lm-panel-stdio {
      display: block;
    }
    @media (prefers-reduced-motion: reduce) {
      .lm-diag--pipeline .lm-flow-forward,
      .lm-diag--pipeline .lm-flow-reverse,
      .lm-diag--pipeline .lm-flow-slow,
      .lm-diag--pipeline .lm-pulse {
        animation: none !important;
      }
    }
  </style>

        <text x="365" y="50" text-anchor="middle" fill="var(--lm-p-text)" font-size="13" font-weight="700">Stdio Lifecycle Adapter</text>
