        <text x="115" y="162" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Persists TaskRecord before return</text>
        <text x="115" y="186" text-anchor="middle" fill="var(--lm-t-emerald)" font-size="9.5" font-family="monospace">Returns CreateTaskResult</text>

        <line class="lm-flow-forward" x1="214" y1="114" x2="252" y2="114" stroke="var(--lm-t-blue)" stroke-width="2.5" />

        <text x="592" y="48" text-anchor="middle" fill="var(--lm-t-text)" font-size="13" font-weight="700">Worker Rehydration</text>
        <text x="592" y="70" text-anchor="middle" fill="var(--lm-t-violet)" font-size="10.5" font-family="monospace">Replica Worker Execution</text>

      </svg>
    </div>

    <div class="lm-task-panel lm-panel-inproc">
      <svg viewBox="0 0 920 310" role="img" aria-labelledby="lm-task-in-title lm-task-in-desc">
        <title id="lm-task-in-title">Built-In MCPTaskStore, Promoted Progress/Logging, and Elicitation Lifecycle</title>
        <desc id="lm-task-in-desc">Built-in MCPTaskStore persists strictly owner-scoped TaskRecord and ToolTaskCall metadata (progress_token, session_id, log_level), updates TaskRecord.statusMessage via MCPTaskStore.update_status_message(), and forwards notifications/progress and notifications/message onto 2025-* GET /mcp session SSE streams while 2026-07-28 subscriptions/listen carries taskIds and opted-in logLevel events (excluding progress).</desc>

        <rect x="16" y="24" width="224" height="180" rx="10" fill="var(--lm-t-card)" stroke="var(--lm-t-blue)" stroke-width="2" />
        <circle class="lm-pulse" cx="34" cy="44" r="5" fill="var(--lm-t-blue)" />
        <text x="128" y="48" text-anchor="middle" fill="var(--lm-t-text)" font-size="13" font-weight="700">Promoted Context</text>
        <text x="128" y="70" text-anchor="middle" fill="var(--lm-t-blue)" font-size="10.5" font-family="monospace">tools/call (params.task)</text>
        <text x="128" y="90" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Validates task="optional" | "required"</text>
        <text x="128" y="108" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Captures ToolTaskCall(progress_token,</text>
        <text x="128" y="126" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">session_id, log_level, owner_id)</text>
        <text x="128" y="144" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Single-writer Store keys with TTL</text>
        <text x="128" y="162" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Detaches runner after HTTP return</text>
        <text x="128" y="186" text-anchor="middle" fill="var(--lm-t-emerald)" font-size="9.5" font-family="monospace">Immediate taskId handle</text>

        <line class="lm-flow-forward" x1="240" y1="114" x2="288" y2="114" stroke="var(--lm-t-blue)" stroke-width="2.5" />

        <rect x="288" y="24" width="272" height="180" rx="10" fill="var(--lm-t-card)" stroke="var(--lm-t-amber)" stroke-width="2" />
        <text x="424" y="48" text-anchor="middle" fill="var(--lm-t-text)" font-size="13" font-weight="700">MCPTaskStore State Machine</text>
        <text x="424" y="70" text-anchor="middle" fill="var(--lm-t-amber)" font-size="10.5" font-family="monospace">litestar_mcp_tasks Store</text>
        <text x="424" y="90" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">working -&gt; input_required -&gt; completed</text>

        <text x="424" y="144" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Updates TaskRecord.statusMessage live</text>
        <text x="424" y="162" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Filters ctx.log() by session log_level</text>
        <text x="424" y="186" text-anchor="middle" fill="var(--lm-t-amber)" font-size="9.5" font-family="monospace">Zero external broker required</text>

        <line class="lm-flow-forward" x1="560" y1="114" x2="608" y2="114" stroke="var(--lm-t-emerald)" stroke-width="2.5" />

        <rect x="608" y="24" width="296" height="180" rx="10" fill="var(--lm-t-card)" stroke="var(--lm-t-emerald)" stroke-width="2" />
        <circle class="lm-pulse" cx="628" cy="44" r="5" fill="var(--lm-t-emerald)" />
        <text x="756" y="48" text-anchor="middle" fill="var(--lm-t-text)" font-size="13" font-weight="700">Session SSE, Poll &amp; Resume</text>
        <text x="756" y="70" text-anchor="middle" fill="var(--lm-t-emerald)" font-size="10.5" font-family="monospace">GET /mcp SSE • tasks/get • update</text>
        <text x="756" y="90" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">Forwards notifications/progress &amp; message</text>
        <text x="756" y="108" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">onto 2025-11-25 GET /mcp session SSE</text>
        <text x="756" y="126" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">subscriptions/listen: tasks + logLevel only</text>
        <text x="756" y="144" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">tasks/get returns statusMessage &amp; result</text>
        <text x="756" y="162" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10">tasks/update resumes &amp; refreshes log_level</text>
        <text x="756" y="186" text-anchor="middle" fill="var(--lm-t-emerald)" font-size="9.5" font-family="monospace">Owner-isolated lookup &amp; tasks/cancel</text>

        <rect x="16" y="220" width="888" height="72" rx="8" fill="var(--lm-t-card)" stroke="var(--lm-t-border)" stroke-width="1.5" />

        <text x="460" y="259" text-anchor="middle" fill="var(--lm-t-muted)" font-size="10" font-family="monospace">ToolTaskCall(progress_token, session_id, log_level) -&gt; MCPTaskStore.update_status_message() -&gt; TaskRecord.statusMessage</text>
        <text x="460" y="277" text-anchor="middle" fill="var(--lm-t-muted)" font-size="9.5" font-family="monospace">2025-* GET /mcp: notifications/progress + notifications/message  |  2026-07-28 subscriptions/listen: excludes progress</text>
