<div class="lm-diagram lm-diag lm-diag--a2a">
  <style>
    .lm-diag--a2a {
      --lm-x-surface: var(--md-default-bg-color, #ffffff);
      --lm-x-card: var(--md-code-bg-color, #f8fafc);
      --lm-x-border: rgba(148, 163, 184, 0.35);
      --lm-x-text: var(--md-default-fg-color, #0f172a);
      --lm-x-muted: var(--md-default-fg-color--light, #475569);
      --lm-x-blue: #2563eb;
      --lm-x-amber: #d97706;
      --lm-x-emerald: #059669;
      --lm-x-violet: #7c3aed;
      --lm-x-rose: #e11d48;
      background: var(--lm-x-surface);
      border: 1px solid var(--lm-x-border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin: 1.5rem 0;
    }
    [data-md-color-scheme="slate"] .lm-diag--a2a {
      --lm-x-surface: #121521;
      --lm-x-card: #171b2a;
      --lm-x-border: rgba(148, 163, 184, 0.24);
      --lm-x-blue: #60a5fa;
      --lm-x-amber: #fbbf24;
      --lm-x-emerald: #34d399;
      --lm-x-violet: #a78bfa;
      --lm-x-rose: #fb7185;
    }
    .lm-diag--a2a input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    #lm-a2a-bindings:checked ~ .lm-diag-tabs label[for="lm-a2a-bindings"],
    #lm-a2a-tenancy:checked ~ .lm-diag-tabs label[for="lm-a2a-tenancy"] {
      border-color: var(--lm-x-blue);
      background: rgba(37, 99, 235, 0.14);
      color: var(--lm-x-blue);
    }
    .lm-diag--a2a .lm-a2a-panel {
      display: none;
    }
    #lm-a2a-bindings:checked ~ .lm-a2a-panels .lm-panel-bindings,
    #lm-a2a-tenancy:checked ~ .lm-a2a-panels .lm-panel-tenancy {
      display: block;
    }
    @media (prefers-reduced-motion: reduce) {
      .lm-diag--a2a .lm-flow-forward,
      .lm-diag--a2a .lm-flow-reverse,
      .lm-diag--a2a .lm-flow-slow,
      .lm-diag--a2a .lm-pulse {
        animation: none !important;
      }
    }
  </style>

  <input type="radio" name="lm-a2a-mode" id="lm-a2a-bindings" checked />
  <input type="radio" name="lm-a2a-mode" id="lm-a2a-tenancy" />

  <div class="lm-diag-tabs" role="tablist" aria-label="LitestarA2A Architecture Views">
    <label class="lm-diag-tab" for="lm-a2a-bindings">Dual Transport Bindings (JSON-RPC 2.0 &amp; HTTP+JSON REST)</label>
    <label class="lm-diag-tab" for="lm-a2a-tenancy">Multi-Tenant Resolution &amp; Agent Card Security</label>
  </div>

  <div class="lm-a2a-panels">
    <div class="lm-a2a-panel lm-panel-bindings">
      <svg viewBox="0 0 920 290" role="img" aria-labelledby="lm-a2a-b-title lm-a2a-b-desc">
        <title id="lm-a2a-b-title">LitestarA2A Dual Transport Bindings and AgentExecutor Pipeline</title>
        <desc id="lm-a2a-b-desc">LitestarA2A serves /.well-known/agent-card.json, JSON-RPC 2.0 at /a2a, and A2A 1.0 HTTP+JSON REST routes (:cancel, :subscribe, /message:send, /message:stream) backed by DefaultRequestHandler and AgentExecutor.</desc>

        <rect x="16" y="22" width="212" height="170" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-blue)" stroke-width="2" />
        <circle class="lm-pulse" cx="34" cy="42" r="5" fill="var(--lm-x-blue)" />
        <text x="122" y="46" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">1. Discovery &amp; Clients</text>
        <text x="122" y="70" text-anchor="middle" fill="var(--lm-x-blue)" font-size="10" font-family="monospace">/.well-known/agent-card.json</text>
        <text x="122" y="92" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">agent_card_route_opt (public)</text>
        <text x="122" y="110" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Advertises JSONRPC &amp; HTTP+JSON</text>
        <text x="122" y="128" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Lists AgentSkill capabilities</text>
        <text x="122" y="146" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">A2A-Version: 1.0 header</text>
        <text x="122" y="168" text-anchor="middle" fill="var(--lm-x-emerald)" font-size="10" font-family="monospace">enable_http_json=True</text>

        <line class="lm-flow-forward" x1="228" y1="88" x2="274" y2="88" stroke="var(--lm-x-blue)" stroke-width="2.5" />
        <line class="lm-flow-forward" x1="228" y1="128" x2="274" y2="128" stroke="var(--lm-x-amber)" stroke-width="2.5" />

        <rect x="274" y="22" width="222" height="170" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-amber)" stroke-width="2" />
        <text x="385" y="46" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">2. Dual Transport Routes</text>
        <text x="385" y="70" text-anchor="middle" fill="var(--lm-x-amber)" font-size="11" font-family="monospace">POST /a2a (JSON-RPC 2.0)</text>
        <text x="385" y="92" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">POST /a2a/message:send</text>
        <text x="385" y="110" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">POST /a2a/message:stream (SSE)</text>
        <text x="385" y="128" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">GET /a2a/tasks &amp; /tasks/{id}</text>
        <text x="385" y="146" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">POST /a2a/tasks/{id}:cancel</text>
        <text x="385" y="168" text-anchor="middle" fill="var(--lm-x-amber)" font-size="10" font-family="monospace">POST /a2a/tasks/{id}:subscribe</text>

        <line class="lm-flow-forward" x1="496" y1="106" x2="542" y2="106" stroke="var(--lm-x-violet)" stroke-width="2.5" />

        <rect x="542" y="22" width="184" height="170" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-violet)" stroke-width="2" />
        <text x="634" y="46" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">3. Request Handler</text>
        <text x="634" y="70" text-anchor="middle" fill="var(--lm-x-violet)" font-size="10" font-family="monospace">DefaultRequestHandler</text>
        <text x="634" y="92" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Builds ServerCallContext</text>
        <text x="634" y="110" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">context_builder hook</text>
        <text x="634" y="128" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">InMemoryTaskStore / custom</text>
        <text x="634" y="146" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">PushNotificationConfigStore</text>
        <text x="634" y="168" text-anchor="middle" fill="var(--lm-x-violet)" font-size="10" font-family="monospace">ProtoJSON Event Serializer</text>

        <line class="lm-flow-forward" x1="726" y1="106" x2="764" y2="106" stroke="var(--lm-x-emerald)" stroke-width="2.5" />

        <rect x="764" y="22" width="140" height="170" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-emerald)" stroke-width="2" />
        <circle class="lm-pulse" cx="782" cy="42" r="5" fill="var(--lm-x-emerald)" />
        <text x="834" y="46" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">4. Executor</text>
        <text x="834" y="70" text-anchor="middle" fill="var(--lm-x-emerald)" font-size="10" font-family="monospace">AgentExecutor</text>
        <text x="834" y="92" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">execute(ctx, queue)</text>
        <text x="834" y="110" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">cancel(ctx, queue)</text>
        <text x="834" y="128" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Or agent_to_a2a()</text>
        <text x="834" y="146" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Emits TaskStatus</text>
        <text x="834" y="168" text-anchor="middle" fill="var(--lm-x-emerald)" font-size="10" font-family="monospace">&amp; ArtifactUpdate</text>

        <rect x="16" y="212" width="888" height="58" rx="8" fill="var(--lm-x-card)" stroke="var(--lm-x-border)" stroke-width="1.5" />
        <text x="460" y="234" text-anchor="middle" fill="var(--lm-x-text)" font-size="12" font-weight="700">Official a2a-sdk 1.0 Wire Compliance</text>
        <text x="460" y="254" text-anchor="middle" fill="var(--lm-x-muted)" font-size="11" font-family="monospace">Single A2AConfig mounts JSON-RPC 2.0, HTTP+JSON REST (:send, :stream, :cancel, :subscribe), and Push Notifications</text>
      </svg>
    </div>

    <div class="lm-a2a-panel lm-panel-tenancy">
      <svg viewBox="0 0 920 290" role="img" aria-labelledby="lm-a2a-t-title lm-a2a-t-desc">
        <title id="lm-a2a-t-title">Multi-Tenant Resolution and Split Route Security</title>
        <desc id="lm-a2a-t-desc">Multi-tenant resolution extracts tenant identity from /{tenant:str}/a2a path parameters or X-A2A-Tenant headers, passes it through context_builder into ServerCallContext.tenant, and separates public agent_card_route_opt from protected route_opt.</desc>

        <rect x="16" y="26" width="265" height="162" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-blue)" stroke-width="2" />
        <text x="148" y="50" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">1. Tenant Extraction Sources</text>
        <text x="148" y="74" text-anchor="middle" fill="var(--lm-x-blue)" font-size="11" font-family="monospace">Path Param + Header</text>
        <text x="148" y="98" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">base_path="/{tenant:str}/a2a"</text>
        <text x="148" y="116" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Or Header: X-A2A-Tenant: acme</text>
        <text x="148" y="134" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Precedence: path param &gt; header</text>
        <text x="148" y="152" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Applies to JSON-RPC &amp; HTTP+JSON</text>
        <text x="148" y="172" text-anchor="middle" fill="var(--lm-x-blue)" font-size="10" font-family="monospace">Tenant-scoped URLs in AgentCard</text>

        <line class="lm-flow-forward" x1="281" y1="107" x2="334" y2="107" stroke="var(--lm-x-blue)" stroke-width="2.5" />

        <rect x="334" y="26" width="252" height="162" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-amber)" stroke-width="2" />
        <circle class="lm-pulse" cx="354" cy="46" r="5" fill="var(--lm-x-amber)" />
        <text x="460" y="50" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">2. Context Builder &amp; Auth</text>
        <text x="460" y="74" text-anchor="middle" fill="var(--lm-x-amber)" font-size="11" font-family="monospace">ServerCallContext.tenant</text>
        <text x="460" y="98" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Default builder populates .tenant</text>
        <text x="460" y="116" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Custom A2AConfig.context_builder</text>
        <text x="460" y="134" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Forwards request.user &amp; request.auth</text>
        <text x="460" y="152" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Enforces Litestar router guards</text>
        <text x="460" y="172" text-anchor="middle" fill="var(--lm-x-amber)" font-size="10" font-family="monospace">context.state["litestar_request"]</text>

        <line class="lm-flow-forward" x1="586" y1="107" x2="639" y2="107" stroke="var(--lm-x-emerald)" stroke-width="2.5" />

        <rect x="639" y="26" width="265" height="162" rx="10" fill="var(--lm-x-card)" stroke="var(--lm-x-emerald)" stroke-width="2" />
        <text x="771" y="50" text-anchor="middle" fill="var(--lm-x-text)" font-size="13" font-weight="700">3. Split Route Opt Security</text>
        <text x="771" y="74" text-anchor="middle" fill="var(--lm-x-emerald)" font-size="11" font-family="monospace">route_opt vs agent_card_route_opt</text>
        <text x="771" y="98" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">route_opt={"auth": required(...)}</text>
        <text x="771" y="116" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Protects RPC &amp; REST execution routes</text>
        <text x="771" y="134" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">agent_card_route_opt={"auth": public()}</text>
        <text x="771" y="152" text-anchor="middle" fill="var(--lm-x-muted)" font-size="10">Keeps /.well-known/agent-card.json open</text>
        <text x="771" y="172" text-anchor="middle" fill="var(--lm-x-emerald)" font-size="10" font-family="monospace">First-party litestar-security ready</text>

        <rect x="16" y="212" width="888" height="58" rx="8" fill="var(--lm-x-card)" stroke="var(--lm-x-border)" stroke-width="1.5" />
        <text x="460" y="234" text-anchor="middle" fill="var(--lm-x-text)" font-size="12" font-weight="700">Zero-Leakage Tenant Isolation</text>
        <text x="460" y="254" text-anchor="middle" fill="var(--lm-x-muted)" font-size="11" font-family="monospace">GET /acme/a2a/tasks?tenant=acme  |  X-A2A-Tenant: acme  -&gt;  ServerCallContext(tenant="acme")</text>
      </svg>
    </div>
  </div>
</div>
