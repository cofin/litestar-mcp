name: Test

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      coverage:
        required: false
        type: boolean
        default: false
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    defaults:
      run:
        shell: bash
    env:
      PYTHON_VERSION: ${{ inputs.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Microsoft ODBC Drivers
        run: sudo ACCEPT_EULA=Y apt-get install msodbcsql18 -y

      - name: Free additional space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          sudo apt-get autoremove -y \
          && sudo apt-get clean -y \
          && sudo rm -rf /root/.cache \
          && sudo rm -rf /var/apt/lists/* \
          && sudo rm -rf /var/cache/apt/* \
          && sudo apt-get purge -y --auto-remove -o APT::AutoRemove::RecommendsImportant=false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --group test --extra a2a --python "$PYTHON_VERSION"

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Test
        if: ${{ !inputs.coverage }}
        run: uv run pytest --dist "loadgroup" -m "" tests docs/examples -n 2

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: uv run pytest tests docs/examples --dist "loadgroup" -m "" --cov=litestar_mcp --cov-branch --cov-report=xml -n 2

      - name: Build and smoke-test installed wheel
        run: |
          uv build --wheel --out-dir /tmp/litestar-mcp-dist
          uv venv --python "$PYTHON_VERSION" /tmp/litestar-mcp-wheel
          WHEEL=$(ls /tmp/litestar-mcp-dist/litestar_mcp-*.whl)
          uv pip install --python /tmp/litestar-mcp-wheel/bin/python "$WHEEL"
          cd /tmp
          cat > /tmp/smoke.py <<'PY'
          from importlib.resources import files
          from pkgutil import walk_packages
          import importlib
          import sys

          import litestar_mcp
          from litestar_mcp.core.exceptions import MissingDependencyError

          with_a2a = sys.argv[1] == "a2a"
          for module in walk_packages(litestar_mcp.__path__, "litestar_mcp."):
              if any(part.startswith("_") for part in module.name.split(".")):
                  continue
              optional = module.name.startswith("litestar_mcp.a2a")
              if optional and not with_a2a:
                  try:
                      importlib.import_module(module.name)
                  except MissingDependencyError as exc:
                      assert "a2a-sdk" in str(exc), exc
                  else:
                      raise AssertionError(f"{module.name} imported without the a2a extra")
              else:
                  importlib.import_module(module.name)

          assert files("litestar_mcp").joinpath("py.typed").is_file()
          assert "pytest" not in sys.modules
          PY
          /tmp/litestar-mcp-wheel/bin/python -I /tmp/smoke.py base
          uv pip install --python /tmp/litestar-mcp-wheel/bin/python "${WHEEL}[a2a]"
          /tmp/litestar-mcp-wheel/bin/python -I /tmp/smoke.py a2a

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.coverage }}
        with:
          name: coverage-xml
          path: coverage.xml
